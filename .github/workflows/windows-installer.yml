name: Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/windows/**"
      - "packaging/windows/**"
      - "makefile"
      - "version.conf"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

jobs:
  installer:
    name: Build and smoke-test Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            mingw-w64-ucrt-x86_64-gcc

      - name: Install Inno Setup
        shell: cmd
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: msys2 {0}
        run: bash scripts/windows/build_installer.sh

      - name: Verify development artifact and checksum
        shell: msys2 {0}
        run: bash scripts/windows/verify_installer_artifact.sh

      - name: Smoke-test install, execution, and uninstall
        shell: msys2 {0}
        run: bash scripts/windows/test_installer.sh

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: sagan-windows-x64-installer
          path: |
            build/installer/*.exe
            build/installer/*.exe.sha256
          if-no-files-found: error
