name: Prepare release from main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sagan-release-tag-main
  cancel-in-progress: false

jobs:
  prepare-tag:
    name: Prepare verified release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine whether main needs a release
        id: candidate
        shell: bash
        run: |
          bash scripts/version.sh check-badge
          version="$(bash scripts/version.sh numeric)"
          tag="v$version"
          if [[ "$version" != 0.* ]] && ! git show-ref --verify --quiet "refs/tags/$tag"; then
            printf 'create=true\n' >> "$GITHUB_OUTPUT"
            printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          else
            echo "No new stable release: $tag is pre-1.0 or already tagged."
            printf 'create=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Sign and push the immutable release tag
        if: steps.candidate.outputs.create == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
          SIGNING_KEY: ${{ secrets.SAGAN_RELEASE_TAG_SSH_PRIVATE_KEY }}
        run: |
          [[ -n "$SIGNING_KEY" ]] || {
            echo 'Configure the SAGAN_RELEASE_TAG_SSH_PRIVATE_KEY repository secret before releasing.' >&2
            exit 1
          }
          key_file="$RUNNER_TEMP/sagan-release-tag-key"
          umask 077
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key_file"
          public_key="$(ssh-keygen -y -f "$key_file" | awk '{print $1 " " $2}')"
          grep -Fq " $public_key" .github/allowed_signers || {
            echo 'The release signing key is not in .github/allowed_signers.' >&2
            exit 1
          }
          git config user.name 'Sagan Release Bot'
          git config user.email 'joepshoulak2@gmail.com'
          git -c gpg.format=ssh -c user.signingkey="$key_file" tag -s "$RELEASE_TAG" -m "Sagan ${RELEASE_TAG#v}"
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile=.github/allowed_signers verify-tag "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Run the release gates for the signed tag
        if: steps.candidate.outputs.create == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          # A tag pushed with GITHUB_TOKEN does not trigger a push workflow.
          # workflow_dispatch does, and uses the signed tag as its ref.
          gh workflow run release.yml --ref "$RELEASE_TAG"
