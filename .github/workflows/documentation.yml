name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/docs.sh"
      - "scripts/docs_examples_test.sh"
      - "scripts/docs_status.py"
      - "scripts/docs_release_check.py"
      - "scripts/docs_versions.sh"
      - "scripts/docs_versions_test.sh"
      - "deploy/docs/**"
      - "deploy/hp1/**"
      - "deploy/hosting/update.sh"
      - "src/**"
      - "makefile"
      - ".github/workflows/documentation.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/docs.sh"
      - "scripts/docs_examples_test.sh"
      - "scripts/docs_status.py"
      - "scripts/docs_release_check.py"
      - "scripts/docs_versions.sh"
      - "scripts/docs_versions_test.sh"
      - "deploy/docs/**"
      - "deploy/hp1/**"
      - "deploy/hosting/update.sh"
      - "src/**"
      - "makefile"
      - ".github/workflows/documentation.yml"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Published documentation version (MAJOR.MINOR.PATCH); leave blank to refresh experimental"
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up documentation environment
        run: bash scripts/docs.sh setup

      - name: Build documentation strictly
        run: bash scripts/docs.sh check

      - name: Test versioned documentation layout
        run: bash scripts/docs_versions_test.sh

  publish-version:
    name: Publish documentation version
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: sagan-docs-versions
      cancel-in-progress: false
    steps:
      - name: Check out the validated commit and generated-docs history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up documentation environment
        run: bash scripts/docs.sh setup

      - name: Publish experimental or released documentation
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            bash scripts/docs_versions.sh deploy-release "$RELEASE_VERSION"
          elif [[ "$WORKFLOW_REF" == "refs/heads/main" ]]; then
            bash scripts/docs_versions.sh deploy-experimental
          else
            echo "Experimental documentation can only be published from main." >&2
            exit 1
          fi

  deploy:
    name: Deploy documentation to HP1
    if: github.event_name != 'pull_request'
    needs:
      - validate
      - publish-version
    runs-on:
      - self-hosted
      - sagan-docs-hp1
    environment: documentation
    timeout-minutes: 15
    concurrency:
      group: sagan-docs-hp1
      cancel-in-progress: false
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 0

      - name: Set up documentation environment
        run: bash scripts/docs.sh setup

      - name: Install origin release locally
        run: bash deploy/hosting/update.sh hp1-local
