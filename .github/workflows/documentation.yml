name: Documentation

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/docs.sh"
      - "scripts/docs_examples_test.sh"
      - "scripts/docs_status.py"
      - "scripts/docs_release_check.py"
      - "scripts/docs_versions.sh"
      - "scripts/docs_versions_test.sh"
      - "deploy/docs/**"
      - "deploy/hp1/**"
      - "deploy/hosting/update.sh"
      - "src/**"
      - "makefile"
      - ".github/workflows/documentation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up documentation environment
        run: bash scripts/docs.sh setup

      - name: Build documentation strictly
        run: bash scripts/docs.sh check

      - name: Test versioned documentation layout
        run: bash scripts/docs_versions_test.sh
