<VirtualHost *:80>
    ServerName sagan.shoulak.org

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyAddHeaders On
    ProxyErrorOverride On

    ProxyPass /site-unavailable/ !
    ProxyPass /__hypervisor-error/ !
    ProxyPass / http://192.168.20.21:8781/
    ProxyPassReverse / http://192.168.20.21:8781/

    ErrorDocument 502 /site-unavailable/
    ErrorDocument 503 /site-unavailable/
    ErrorDocument 504 /site-unavailable/

    ErrorLog ${APACHE_LOG_DIR}/sagan-docs-error.log
    CustomLog ${APACHE_LOG_DIR}/sagan-docs-access.log combined
</VirtualHost>
