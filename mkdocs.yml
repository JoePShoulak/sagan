site_name: Sagan Documentation
site_description: Documentation for the Sagan programming language
site_url: https://sagan.shoulak.org/
docs_dir: docs
site_dir: build/docs-site
strict: true

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  logo: assets/images/sagan-logo.png
  favicon: assets/images/favicon.png
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mike:
      alias_type: redirect
      canonical_version: latest
      version_selector: true

hooks:
  - scripts/docs_status.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

validation:
  absolute_links: relative_to_docs
  unrecognized_links: warn
  anchors: warn

extra:
  version:
    provider: mike
  status:
    work-in-progress: Work in progress
    review-needed: Needs review
    complete: Complete
  documentation:
    version: !ENV [SAGAN_DOCS_VERSION, experimental]
    channel: !ENV [SAGAN_DOCS_CHANNEL, experimental]

extra_css:
  - stylesheets/brand.css
  - stylesheets/status.css

exclude_docs: |
  overrides/

